name: Prepare Locaris migration package

on:
  push:
    branches: [locaris-migration]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: locaris-migration-build
  cancel-in-progress: true

jobs:
  validate-and-build:
    if: github.ref == 'refs/heads/locaris-migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate integration and run tests
        run: |
          python -m compileall -q custom_components/locaris tests
          python -m unittest discover -s tests -p 'test_*.py'
          node --check custom_components/locaris/panel.js
          python - <<'PY'
          import json, pathlib, re
          p = pathlib.Path("custom_components/locaris")
          m = json.loads((p/"manifest.json").read_text())
          v = m["version"]
          assert m["domain"] == "locaris" and m["name"] == "Locaris"
          assert re.fullmatch(r"\d+\.\d+\.\d+(?:-[a-zA-Z0-9.]+)?", v)
          assert f"VERSION='{v}'" in (p/"panel.js").read_text()
          assert f"?v={v}" in (p/"__init__.py").read_text()
          PY
      - name: Generate approved brand resources
        run: |
          python -m pip install 'CairoSVG==2.7.1' 'Pillow==11.3.0'
          python scripts/build_brand.py
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          p = Path("custom_components/locaris/brand")
          expected = {}
          for name in ("icon", "dark_icon", "logo", "dark_logo"):
              for scale, suffix in ((1, ""), (2, "@2x")):
                  expected[name + suffix + ".png"] = ((944 if "logo" in name else 256)*scale, 256*scale)
          assert set(x.name for x in p.glob("*.png")) == set(expected)
          for name, size in expected.items():
              with Image.open(p/name) as im:
                  assert im.size == size and im.mode == "RGBA", name
                  assert im.getchannel("A").getextrema() == (0, 255), name
          PY
      - name: Prepare manual installation archive
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path("custom_components/locaris")
          with zipfile.ZipFile("Locaris-migration-install.zip","w",zipfile.ZIP_DEFLATED) as z:
              for path in sorted(root.rglob("*")):
                  if path.is_file() and "__pycache__" not in path.parts and path.suffix != ".pyc":
                      z.write(path, path.as_posix())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Locaris-migration-install
          path: Locaris-migration-install.zip
          if-no-files-found: error
      - name: Commit validated PNGs only to migration branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/locaris/brand/*.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add validated Locaris brand PNGs"
          git push origin HEAD:refs/heads/locaris-migration
