name: Validate Locaris

on:
  push:
    branches: [main, locaris-migration]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Python, JavaScript and version
        run: |
          python -m compileall -q custom_components/locaris tests
          python -m unittest discover -s tests -p 'test_*.py'
          node --check custom_components/locaris/panel.js
          node --test tests/test_panel_refresh.cjs tests/test_camera.cjs
          python - <<'PY'
          import json, pathlib, re
          p = pathlib.Path("custom_components/locaris")
          m = json.loads((p/"manifest.json").read_text())
          v = m["version"]
          assert m["domain"] == "locaris" and m["name"] == "Locaris"
          assert re.fullmatch(r"\d+\.\d+\.\d+(?:-[a-zA-Z0-9.]+)?", v)
          assert f"VERSION='{v}'" in (p/"panel.js").read_text()
          assert f"?v={v}" in (p/"__init__.py").read_text()
          assert not (p/"database_migration.py").exists()
          for file in p.rglob("*"):
              if file.suffix in (".py", ".js", ".json"):
                  content = file.read_text()
                  assert "luxe_location" not in content and "probe_" not in content, file
          PY
      - name: Validate committed brand PNGs
        run: |
          python -m pip install 'Pillow==11.3.0'
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          p = Path("custom_components/locaris/brand")
          expected = {}
          for name in ("icon", "dark_icon", "logo", "dark_logo"):
              for scale, suffix in ((1, ""), (2, "@2x")):
                  expected[name + suffix + ".png"] = ((944 if "logo" in name else 256)*scale, 256*scale)
          assert set(x.name for x in p.glob("*.png")) == set(expected)
          for name, size in expected.items():
              with Image.open(p/name) as im:
                  assert im.size == size and im.mode == "RGBA", name
                  assert im.getchannel("A").getextrema() == (0, 255), name
          PY
